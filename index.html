<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="My Money">
<link rel="manifest" href="manifest.json"><title>My Money</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#111827;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}.app{max-width:560px;margin:auto;padding-bottom:90px}
header{background:#fff;padding:22px 18px 12px;position:sticky;top:0;z-index:2}h1{margin:0;font-size:28px}.sub{color:#6b7280;font-size:13px;margin:4px 0 12px}#month{width:100%;padding:11px;border:1px solid #ddd;border-radius:12px;background:#fafafa;font-size:16px}
main{padding:16px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #00000008}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f8fafc;padding:12px;border-radius:14px}.metric small{display:block;color:#6b7280}.metric b{font-size:19px;display:block;margin-top:4px}.balance{font-size:29px;font-weight:800;margin-top:7px}.red{color:#dc2626}.green{color:#15803d}.title{font-weight:700;margin:4px 0 10px}
.item{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #eee}.item:last-child{border:0}.grow{flex:1}.name{font-weight:600}.meta{font-size:12px;color:#6b7280;margin-top:3px}.amount{font-weight:700}.done{text-decoration:line-through;color:#9ca3af}.check{width:23px;height:23px}
.fab{position:fixed;right:18px;bottom:65px;border:0;background:#111827;color:#fff;border-radius:99px;padding:14px 19px;box-shadow:0 5px 20px #0003;z-index:4}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;height:58px;display:flex;justify-content:center;gap:45px;padding-bottom:env(safe-area-inset-bottom);z-index:3}nav button{border:0;background:none;color:#6b7280;font-size:12px}nav button.active{color:#111827;font-weight:700}
.modal{display:none;position:fixed;inset:0;background:#0007;z-index:10;align-items:flex-end}.sheet{background:#fff;width:100%;max-width:560px;margin:auto;border-radius:22px 22px 0 0;padding:20px;max-height:92vh;overflow:auto}.sheet h2{margin:0 0 12px}
label{display:block;color:#6b7280;font-size:13px;margin:11px 0 5px}input[type=text],input[type=number],input[type=date],select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:11px;background:#fff;font-size:16px}.row{display:flex;gap:8px;margin-top:16px}.row button{flex:1;padding:12px;border:0;border-radius:11px}.primary{background:#111827;color:#fff}.secondary{background:#eef0f3}.danger{background:#fee2e2;color:#b91c1c}.empty{text-align:center;color:#6b7280;padding:24px 5px}
</style></head><body>
<div class="app"><header><h1>My Money</h1><div class="sub">Simple monthly money tracker</div><input id="month" type="month"></header><main id="main"></main></div>
<button class="fab" onclick="openAdd()">＋ Add Transaction</button>
<nav><button class="active" onclick="tab('home',this)">Home</button><button onclick="tab('transactions',this)">Transactions</button><button onclick="tab('loans',this)">Loans</button></nav>

<div class="modal" id="modal"><div class="sheet"><h2 id="mt">Add Transaction</h2><input type="hidden" id="eid">
<label>Type</label><select id="pt" onchange="typeChanged()">
<option value="expense">Expense / Payment</option><option value="income">Income</option><option value="borrowed">Borrowed Money</option><option value="repayment">Borrowing Repayment</option>
</select>
<label>Category</label><select id="pc"></select>
<label>Name / Description</label><input id="pn" type="text" placeholder="e.g. Car EMI">
<label>Amount</label><input id="pa" type="number" inputmode="decimal" placeholder="0">
<label>Date</label><input id="pd" type="date">
<label id="personLabel">Person / Note (optional)</label><input id="person" type="text" placeholder="e.g. From Ahmed / To Ahmed">
<label><input id="pp" type="checkbox" style="width:auto"> Paid / Received</label>
<div class="row"><button class="secondary" onclick="closeM()">Cancel</button><button class="primary" onclick="saveP()">Save</button></div>
<div class="row" id="delrow" style="display:none"><button class="danger" onclick="delP()">Delete transaction</button></div>
</div></div>

<script>
const K='my_money_v2';let D=JSON.parse(localStorage.getItem(K)||'null')||{salary:59791,payments:[],loans:[]};let T='home';
const M=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0});
const esc=s=>String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const cats={expense:['Loan / EMI','House','Food','Travel','Social','Shopping','Education','Medical','Family','Other'],income:['Salary','Other Income','Refund','Other'],borrowed:['Borrowed Money'],repayment:['Borrowing Repayment']};
const me=document.getElementById('month');me.value=new Date().toISOString().slice(0,7);
const save=()=>localStorage.setItem(K,JSON.stringify(D));const ps=()=>D.payments.filter(x=>x.date?.slice(0,7)==me.value);
function typeChanged(){let t=pt.value;pc.innerHTML=cats[t].map(x=>`<option>${x}</option>`).join('');person.placeholder=t==='repayment'?'e.g. To Ahmed':t==='borrowed'?'e.g. From Ahmed':'Optional note';personLabel.textContent=(t==='borrowed'?'Borrowed from (optional)':t==='repayment'?'Paid to (optional)':'Note (optional)')}
function list(a){return a.map(p=>`<div class="item"><input class="check" type="checkbox" ${p.paid?'checked':''} onchange="paid('${p.id}')"><div class="grow ${p.paid?'done':''}" onclick="editP('${p.id}')"><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.category)} · ${esc(p.date)}${p.person?' · '+esc(p.person):''}</div></div><div class="amount">${M(p.amount)}</div></div>`).join('')}
function render(){let a=ps(),out=a.filter(x=>x.type!=='income'&&x.type!=='borrowed'&&x.paid).reduce((s,x)=>s+x.amount,0),pending=a.filter(x=>x.type!=='income'&&x.type!=='borrowed'&&!x.paid).reduce((s,x)=>s+x.amount,0),extra=a.filter(x=>x.type==='income'&&x.paid).reduce((s,x)=>s+x.amount,0),borrowed=a.filter(x=>x.type==='borrowed'&&x.paid).reduce((s,x)=>s+x.amount,0),bal=D.salary+extra+borrowed-out-pending;
if(T==='loans'){main.innerHTML=`<div class="card"><div class="title">Loans</div>${D.loans.map(x=>`<div class="item"><div class="grow"><div class="name">${esc(x.name)}</div><div class="meta">Outstanding ${M(x.outstanding)} · EMI ${M(x.emi)}</div></div></div>`).join('')||'<div class="empty">No loans added.</div>'}</div><div class="card"><button class="primary" style="width:100%" onclick="addLoan()">＋ Add Loan</button></div>`;return}
main.innerHTML=`<div class="card"><div class="grid"><div class="metric"><small>Salary</small><b>${M(D.salary)}</b></div><div class="metric"><small>Paid</small><b>${M(out)}</b></div><div class="metric"><small>Pending</small><b>${M(pending)}</b></div><div class="metric"><small>Extra income</small><b>${M(extra+borrowed)}</b></div></div><div class="title" style="margin-top:17px">Expected balance</div><div class="balance ${bal<0?'red':'green'}">${M(bal)}</div></div><div class="card"><div class="title">${T==='home'?'This month':'Transactions'}</div>${list(a)||'<div class="empty">No transactions yet.</div>'}</div>${T==='home'?'<div class="card"><button class="secondary" style="width:100%" onclick="salary()">Change monthly salary</button></div>':''}`}
function tab(t,b){T=t;document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}me.onchange=render;
function paid(id){let p=D.payments.find(x=>x.id===id);p.paid=!p.paid;save();render()}
function openAdd(){modal.style.display='flex';mt.textContent='Add Transaction';eid.value='';pt.value='expense';typeChanged();pn.value='';pa.value='';pd.value=me.value+'-01';person.value='';pp.checked=false;delrow.style.display='none'}
function editP(id){let p=D.payments.find(x=>x.id===id);openAdd();mt.textContent='Edit Transaction';eid.value=id;pt.value=p.type;typeChanged();pc.value=p.category;pn.value=p.name;pa.value=p.amount;pd.value=p.date;person.value=p.person||'';pp.checked=p.paid;delrow.style.display='block'}
function closeM(){modal.style.display='none'}
function saveP(){let id=eid.value||Date.now().toString(),p={id,type:pt.value,category:pc.value,name:pn.value.trim(),amount:+pa.value,date:pd.value,person:person.value.trim(),paid:pp.checked};if(!p.name||!p.amount||!p.date)return alert('Enter name, amount and date.');let i=D.payments.findIndex(x=>x.id===id);i>=0?D.payments[i]=p:D.payments.push(p);save();closeM();render()}
function delP(){D.payments=D.payments.filter(x=>x.id!==eid.value);save();closeM();render()}
function salary(){let v=prompt('Monthly salary',D.salary);if(v!==null&&!isNaN(v)){D.salary=+v;save();render()}}
function addLoan(){let n=prompt('Loan name');if(!n)return;let e=+prompt('Monthly EMI','0')||0,o=+prompt('Outstanding amount','0')||0;D.loans.push({name:n,emi:e,outstanding:o});save();render()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});typeChanged();render();
</script></body></html>
