<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Money">
<link rel="manifest" href="manifest.json">
<title>My Money</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
button,input,select{font:inherit}.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:86px}
header{background:#fff;padding:20px 16px 12px;position:sticky;top:0;z-index:5;border-bottom:1px solid #eee}h1{margin:0;font-size:27px}.sub{font-size:13px;color:#6b7280;margin:3px 0 12px}
#month{width:100%;padding:11px;border:1px solid #ddd;border-radius:12px;background:#fafafa}
main{padding:14px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 9px #00000008}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{background:#f8fafc;padding:12px;border-radius:13px}.metric small{display:block;color:#6b7280;font-size:12px}.metric b{display:block;font-size:18px;margin-top:4px}
.title{font-weight:700;margin-bottom:10px}.balance{font-size:29px;font-weight:800}.red{color:#dc2626}.green{color:#15803d}
.item{display:flex;align-items:center;gap:9px;padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}.grow{flex:1;min-width:0}.name{font-weight:600;word-break:break-word}.meta{font-size:12px;color:#6b7280;margin-top:3px}.amount{font-weight:700;white-space:nowrap}.done{text-decoration:line-through;color:#9ca3af}.check{width:22px;height:22px;flex:none}
.smallbtn{border:0;border-radius:9px;padding:8px 10px;background:#eef0f3;color:#111827;font-size:13px}.danger{background:#fee2e2;color:#b91c1c}.primary{background:#111827;color:#fff}
.fab{position:fixed;right:18px;bottom:67px;border:0;background:#111827;color:#fff;border-radius:999px;padding:14px 18px;box-shadow:0 5px 20px #0003;z-index:7}
nav{position:fixed;left:0;right:0;bottom:0;height:58px;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:center;gap:38px;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:none;color:#6b7280;font-size:12px}nav button.active{color:#111827;font-weight:700}
.modal{display:none;position:fixed;inset:0;background:#0007;z-index:20;align-items:flex-end}.sheet{width:100%;max-width:560px;margin:auto;background:#fff;border-radius:22px 22px 0 0;padding:19px;max-height:92vh;overflow:auto}.sheet h2{margin:0 0 12px}
label{display:block;color:#6b7280;font-size:13px;margin:11px 0 5px}input[type=text],input[type=number],input[type=date],select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:11px;background:#fff}
.row{display:flex;gap:8px;margin-top:15px}.row button{flex:1;border:0;border-radius:11px;padding:12px}.empty{text-align:center;color:#6b7280;padding:22px 4px}
</style>
</head>
<body>
<div class="app">
<header><h1>My Money</h1><div class="sub">Simple monthly money tracker</div><input id="month" type="month"></header>
<main id="main"></main>
</div>
<button class="fab" onclick="openTransaction()">＋ Add Transaction</button>
<nav>
<button id="homeTab" class="active" onclick="showTab('home',this)">Home</button>
<button id="txTab" onclick="showTab('transactions',this)">Transactions</button>
<button id="loanTab" onclick="showTab('loans',this)">Loans</button>
</nav>

<div id="txModal" class="modal"><div class="sheet">
<h2 id="txTitle">Add Transaction</h2>
<input id="txId" type="hidden">
<label>Type</label>
<select id="txType" onchange="updateCategories()">
<option value="expense">Expense / Payment</option>
<option value="income">Income</option>
<option value="borrowed">Borrowed Money</option>
<option value="repayment">Borrowing Repayment</option>
</select>
<label>Category</label><select id="txCategory"></select>
<label>Name / Description</label><input id="txName" type="text" placeholder="e.g. Car EMI">
<label>Amount</label><input id="txAmount" type="number" inputmode="decimal" placeholder="0">
<label>Date</label><input id="txDate" type="date">
<label id="txPersonLabel">Note (optional)</label><input id="txPerson" type="text" placeholder="Optional">
<label><input id="txDone" type="checkbox" style="width:auto"> Paid / Received</label>
<div class="row"><button class="secondary" onclick="closeTransaction()">Cancel</button><button class="primary" onclick="saveTransaction()">Save</button></div>
<div class="row" id="txDeleteRow" style="display:none"><button class="danger" onclick="deleteTransaction()">Delete transaction</button></div>
</div></div>

<div id="loanModal" class="modal"><div class="sheet">
<h2 id="loanTitle">Add Loan</h2><input id="loanId" type="hidden">
<label>Loan name</label><input id="loanName" type="text" placeholder="e.g. KSFE">
<label>Monthly EMI</label><input id="loanEmi" type="number" inputmode="decimal" placeholder="0">
<label>Outstanding amount</label><input id="loanOutstanding" type="number" inputmode="decimal" placeholder="0">
<div class="row"><button class="secondary" onclick="closeLoan()">Cancel</button><button class="primary" onclick="saveLoan()">Save</button></div>
<div class="row" id="loanDeleteRow" style="display:none"><button class="danger" onclick="deleteLoan()">Delete loan</button></div>
</div></div>

<script>
const STORAGE='my_money_clean_v1';
let state=loadState();
let currentTab='home';
const monthInput=document.getElementById('month');
monthInput.value=new Date().toISOString().slice(0,7);

function loadState(){
  try{
    const old=JSON.parse(localStorage.getItem(STORAGE)||'null');
    if(old)return old;
  }catch(e){}
  return {salary:59791,transactions:[],loans:[]};
}
function saveState(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0})}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function currentTransactions(){return state.transactions.filter(t=>String(t.date||'').slice(0,7)===monthInput.value)}
function categories(type){
  return {
    expense:['Loan / EMI','House','Food','Travel','Social','Shopping','Education','Medical','Family','Other'],
    income:['Salary','Other Income','Refund','Other'],
    borrowed:['Borrowed Money'],
    repayment:['Borrowing Repayment']
  }[type]||['Other'];
}
function updateCategories(){
  const type=document.getElementById('txType').value;
  const select=document.getElementById('txCategory');
  select.innerHTML=categories(type).map(x=>'<option>'+esc(x)+'</option>').join('');
  const label=document.getElementById('txPersonLabel');
  const input=document.getElementById('txPerson');
  if(type==='borrowed'){label.textContent='Borrowed from (optional)';input.placeholder='e.g. Ahmed'}
  else if(type==='repayment'){label.textContent='Paid to (optional)';input.placeholder='e.g. Ahmed'}
  else {label.textContent='Note (optional)';input.placeholder='Optional'}
}
function showTab(tab,button){
  currentTab=tab;
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  button.classList.add('active');
  render();
}
monthInput.addEventListener('change',render);

function transactionList(items){
  if(!items.length)return '<div class="empty">No transactions yet.</div>';
  return items.map(t=>`
    <div class="item">
      <input class="check" type="checkbox" ${t.done?'checked':''} onchange="toggleDone('${t.id}')">
      <div class="grow ${t.done?'done':''}" onclick="editTransaction('${t.id}')">
        <div class="name">${esc(t.name)}</div>
        <div class="meta">${esc(t.category)} · ${esc(t.date)}${t.person?' · '+esc(t.person):''}</div>
      </div>
      <div class="amount">${money(t.amount)}</div>
    </div>`).join('');
}

function render(){
  const items=currentTransactions();
  if(currentTab==='loans'){renderLoans();return;}
  const paidExpenses=items.filter(t=>t.done && t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
  const pendingExpenses=items.filter(t=>!t.done && t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
  const income=items.filter(t=>t.done && t.type==='income').reduce((s,t)=>s+Number(t.amount),0);
  const borrowed=items.filter(t=>t.done && t.type==='borrowed').reduce((s,t)=>s+Number(t.amount),0);
  const repayments=items.filter(t=>t.done && t.type==='repayment').reduce((s,t)=>s+Number(t.amount),0);
  const balance=Number(state.salary||0)+income+borrowed-paidExpenses-repayments-pendingExpenses;
  const main=document.getElementById('main');
  main.innerHTML=`
    <div class="card">
      <div class="grid">
        <div class="metric"><small>Salary</small><b>${money(state.salary)}</b></div>
        <div class="metric"><small>Paid</small><b>${money(paidExpenses+repayments)}</b></div>
        <div class="metric"><small>Pending</small><b>${money(pendingExpenses)}</b></div>
        <div class="metric"><small>Extra income</small><b>${money(income+borrowed)}</b></div>
      </div>
      <div class="title" style="margin-top:17px">Expected balance</div>
      <div class="balance ${balance<0?'red':'green'}">${money(balance)}</div>
    </div>
    <div class="card">
      <div class="title">${currentTab==='home'?'This month':'Transactions'}</div>
      ${transactionList(items)}
    </div>
    ${currentTab==='home'?'<div class="card"><button class="smallbtn" style="width:100%" onclick="changeSalary()">Change monthly salary</button></div>':''}`;
}
function renderLoans(){
  const main=document.getElementById('main');
  const list=state.loans.map(l=>`
    <div class="item">
      <div class="grow">
        <div class="name">${esc(l.name)}</div>
        <div class="meta">Outstanding ${money(l.outstanding)} · EMI ${money(l.emi)}</div>
      </div>
      <button class="smallbtn" onclick="editLoan('${l.id}')">Edit</button>
      <button class="smallbtn danger" onclick="deleteLoan('${l.id}')">Delete</button>
    </div>`).join('');
  main.innerHTML=`
    <div class="card"><div class="title">Loans</div>${list||'<div class="empty">No loans added.</div>'}</div>
    <div class="card"><button class="primary" style="width:100%;border:0;border-radius:11px;padding:12px" onclick="openLoan()">＋ Add Loan</button></div>`;
}
function openTransaction(id){
  const modal=document.getElementById('txModal');
  modal.style.display='flex';
  document.getElementById('txTitle').textContent=id?'Edit Transaction':'Add Transaction';
  document.getElementById('txId').value=id||'';
  if(id){
    const t=state.transactions.find(x=>x.id===id);
    if(!t)return;
    document.getElementById('txType').value=t.type;
    updateCategories();
    document.getElementById('txCategory').value=t.category;
    document.getElementById('txName').value=t.name;
    document.getElementById('txAmount').value=t.amount;
    document.getElementById('txDate').value=t.date;
    document.getElementById('txPerson').value=t.person||'';
    document.getElementById('txDone').checked=!!t.done;
    document.getElementById('txDeleteRow').style.display='flex';
  }else{
    document.getElementById('txType').value='expense';
    updateCategories();
    document.getElementById('txName').value='';
    document.getElementById('txAmount').value='';
    document.getElementById('txDate').value=monthInput.value+'-01';
    document.getElementById('txPerson').value='';
    document.getElementById('txDone').checked=false;
    document.getElementById('txDeleteRow').style.display='none';
  }
}
function closeTransaction(){document.getElementById('txModal').style.display='none'}
function saveTransaction(){
  const id=document.getElementById('txId').value||String(Date.now());
  const t={
    id,
    type:document.getElementById('txType').value,
    category:document.getElementById('txCategory').value,
    name:document.getElementById('txName').value.trim(),
    amount:Number(document.getElementById('txAmount').value||0),
    date:document.getElementById('txDate').value,
    person:document.getElementById('txPerson').value.trim(),
    done:document.getElementById('txDone').checked
  };
  if(!t.name||!t.amount||!t.date){alert('Please enter name, amount and date.');return}
  const i=state.transactions.findIndex(x=>x.id===id);
  if(i>=0)state.transactions[i]=t;else state.transactions.push(t);
  saveState();closeTransaction();render();
}
function editTransaction(id){openTransaction(id)}
function deleteTransaction(){
  const id=document.getElementById('txId').value;
  if(confirm('Delete this transaction?')){state.transactions=state.transactions.filter(x=>x.id!==id);saveState();closeTransaction();render()}
}
function toggleDone(id){
  const t=state.transactions.find(x=>x.id===id);
  if(t){t.done=!t.done;saveState();render()}
}
function changeSalary(){
  const v=prompt('Monthly salary',state.salary);
  if(v!==null&&!isNaN(v)){state.salary=Number(v);saveState();render()}
}
function openLoan(id){
  document.getElementById('loanModal').style.display='flex';
  document.getElementById('loanId').value=id||'';
  document.getElementById('loanTitle').textContent=id?'Edit Loan':'Add Loan';
  if(id){
    const l=state.loans.find(x=>x.id===id);
    document.getElementById('loanName').value=l.name;
    document.getElementById('loanEmi').value=l.emi;
    document.getElementById('loanOutstanding').value=l.outstanding;
    document.getElementById('loanDeleteRow').style.display='flex';
  }else{
    document.getElementById('loanName').value='';
    document.getElementById('loanEmi').value='';
    document.getElementById('loanOutstanding').value='';
    document.getElementById('loanDeleteRow').style.display='none';
  }
}
function closeLoan(){document.getElementById('loanModal').style.display='none'}
function saveLoan(){
  const id=document.getElementById('loanId').value||String(Date.now());
  const l={
    id,
    name:document.getElementById('loanName').value.trim(),
    emi:Number(document.getElementById('loanEmi').value||0),
    outstanding:Number(document.getElementById('loanOutstanding').value||0)
  };
  if(!l.name){alert('Please enter loan name.');return}
  const i=state.loans.findIndex(x=>x.id===id);
  if(i>=0)state.loans[i]=l;else state.loans.push(l);
  saveState();closeLoan();render();
}
function editLoan(id){openLoan(id)}
function deleteLoan(id){
  const l=state.loans.find(x=>x.id===id);
  if(l&&confirm('Delete '+l.name+'?')){state.loans=state.loans.filter(x=>x.id!==id);saveState();render()}
}
updateCategories();
render();
</script>
</body></html>
